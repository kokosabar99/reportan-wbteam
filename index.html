<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WDBOS REPORT • WBTEAM</title><link rel="stylesheet" href="/assets/style.css"></head><body><div id="toast"></div><section id="auth" class="auth"><div class="card login"><div class="login-emblem">✦ &nbsp; PRIVATE STAFF PORTAL</div><div class="brand">◈ WDBOS <span>REPORT</span></div><p class="muted">WBTEAM • Staff Reporting System</p><div class="login-divider"><span>SECURE OPERATIONS CENTER</span></div><div class="tabs"><button id="loginTab" class="selected" onclick="authMode('login')">Masuk</button><button id="registerTab" onclick="authMode('register')">Daftar Staff</button></div><form id="authForm"><div id="nameWrap" hidden><label>Nama Lengkap (sesuai whitelist)</label><input id="full_name" autocomplete="name"></div><label>Username</label><input id="username" required autocomplete="username"><label>Password</label><div class="password-wrap"><input id="password" type="password" required autocomplete="current-password"><button type="button" class="eye-toggle" onclick="togglePassword('password',this)" aria-label="Tampilkan password">👁</button></div><button class="primary full">Lanjutkan →</button></form></div></section><div id="app" hidden><aside><div class="brand">◈ WDBOS <span>REPORT</span></div><small class="side-caption">● &nbsp; WBTEAM / OPERASIONAL</small><nav id="nav"></nav><div class="sidebottom"><div id="who"></div><button onclick="logout()" class="ghost">Keluar ↗</button></div></aside><main><header><div><small class="breadcrumb">WDBOS <span>/</span> WBTEAM <span>/</span> WORKSPACE</small><h1 id="pageTitle">Dashboard</h1></div><div class="row header-tools"><button id="notifyBtn" class="ghost" type="button" onclick="enableNotifications()">🔔 Aktifkan Notifikasi</button><div class="pill" id="clock"></div><div class="avatar" title="Staff aktif">✦</div></div></header><div class="workspace-banner"><span class="live-dot"></span> OPERATIO
